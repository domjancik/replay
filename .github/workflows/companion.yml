name: Companion builds
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, platform: windows-x64}
          - {os: macos-15, platform: macos-arm64}
          - {os: macos-15-intel, platform: macos-x64}
          - {os: ubuntu-22.04, platform: linux-x64}
          - {os: ubuntu-24.04-arm, platform: linux-arm64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Linux display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - run: python -m pip install pyinstaller==6.22.0 pytest
      - name: Companion tests
        env:
          PYTHONPATH: src
        run: python -m pytest tests/companion -q -o addopts=
      - name: Build and smoke test
        if: runner.os != 'Linux'
        run: python scripts/package-companion.py --platform ${{ matrix.platform }}
      - name: Build and smoke test Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/package-companion.py --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: companion-${{ matrix.platform }}
          path: artifacts/companion-release/*
          if-no-files-found: error
