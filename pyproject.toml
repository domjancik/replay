[project]
name = "rm-redraw"
version = "0.1.0"
description = "Read-only reMarkable acquisition, stroke replay, and renderer research toolchain"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy>=2.1,<3",
  "pillow>=11,<13",
  "pypdf>=5,<7",
  "rmscene==0.8.0",
  "scikit-image>=0.25,<0.27",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rm_redraw"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
