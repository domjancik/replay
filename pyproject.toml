[project]
name = "rm-redraw"
version = "0.1.0"
description = "Read-only reMarkable acquisition, stroke replay, and renderer research toolchain"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy>=2.1,<3",
  "pillow>=11,<13",
  "pypdf>=5,<7",
  "rmscene==0.8.0",
  "scikit-image>=0.25,<0.27",
  "scipy>=1.14,<2",
]

[project.scripts]
rm-redraw = "rm_redraw.web.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
  "/src/rm_redraw", "/tests", "/native/pencil-kernel/src",
  "/native/pencil-kernel/tests", "/native/pencil-kernel/Cargo.toml",
  "/native/pencil-kernel/Cargo.lock", "/native/pencil-kernel/README.md",
  "/native/wasm-prototype/Cargo.toml", "/native/wasm-prototype/Cargo.lock",
  "/native/wasm-prototype/src/lib.rs", "/native/wasm-prototype/pencil.mjs",
  "/native/wasm-prototype/pencil.test.mjs", "/native/wasm-prototype/make_goldens.py",
  "/native/browser-prototype/fetch-runtime.ps1", "/native/browser-prototype/index.html",
  "/native/browser-prototype/make_fixture.py", "/native/browser-prototype/render_probe.py",
  "/native/browser-prototype/replay.mjs", "/native/browser-prototype/replay.test.mjs",
  "/native/browser-prototype/serve.mjs", "/native/browser-prototype/worker.mjs",
  "/native/video-prototype/README.md", "/native/video-prototype/package.json",
  "/native/video-prototype/package-lock.json", "/native/video-prototype/encoder.mjs",
  "/native/video-prototype/browser.mjs", "/native/video-prototype/build.mjs",
  "/native/video-prototype/harness.html", "/native/video-prototype/harness.mjs",
  "/native/video-prototype/harness-worker.mjs", "/native/video-prototype/encode.test.mjs",
  "/native/video-prototype/smoke.mjs",
  "/native/rmctl-pairing/code-stdin.patch", "/native/rmctl-pairing/README.md",
  "/native/rmctl-pairing/LICENSE",
  "/native/renderer/src", "/native/renderer/tests", "/native/renderer/Cargo.toml",
  "/native/renderer/Cargo.lock", "/native/renderer/LICENSE-PILLOW",
  "/native/renderer/generate_goldens.py", "/native/renderer/renderer.mjs",
  "/native/renderer/renderer.test.mjs", "/native/renderer/verify.mjs",
  "/native/renderer/benchmark-cache.mjs",
  "/native/renderer/browser/app.mjs", "/native/renderer/browser/index.html",
  "/native/renderer/browser/serve.mjs", "/native/renderer/browser/worker.mjs",
  "/scripts/start-replay.ps1", "/scripts/setup.ps1",
  "/scripts/check-release.py", "/scripts/release-smoke.py",
  "/docs/install.md", "/docs/local-replay-utility.md", "/docs/contracts.md",
  "/docs/calibration-journey.md", "/docs/renderer-landscape.md",
  "/docs/cloud-connector.md", "/docs/cloud-app-feasibility.md", "/docs/wasm-feasibility.md",
  "/docs/rust-renderer.md",
  "/docs/publication-readiness.md", "/README.md", "/THIRD_PARTY_NOTICES.md",
  "/LICENSE", "/pyproject.toml", "/uv.lock", "/.python-version", "/.gitignore",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rm_redraw"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
