[package]
name = "rm-rmdoc"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Bounded reMarkable notebook archive, page decoding and normalization"
publish = false
readme = "README.md"
include = ["src/**", "tests/*.rs", "Cargo.toml", "Cargo.lock", "README.md", "FORMAT_UPDATES.md", "LICENSE*", "reader.mjs"]

[lib]
name = "rm_rmdoc"
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
sha2 = "=0.10.9"
zip = { version = "=2.4.2", default-features = false, features = ["deflate-flate2", "flate2"] }
flate2 = { version = "=1.1.11", default-features = false, features = ["rust_backend"] }

[profile.release]
lto = true
codegen-units = 1
