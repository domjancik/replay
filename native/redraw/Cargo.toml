[package]
name = "rm-redraw"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Deterministic reMarkable ink rendering and progressive stroke reveal for native and WebAssembly hosts"
repository = "https://github.com/domjancik/replay"
homepage = "https://replay.domj.net"
readme = "README.md"
keywords = ["remarkable", "renderer", "ink", "wasm", "raster"]
categories = ["graphics", "rendering", "wasm"]
include = ["src/**", "tests/*.rs", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE*", "renderer.mjs"]
license = "MIT AND MIT-CMU"

[lib]
name = "redraw"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"

[profile.release]
lto = true
codegen-units = 1
