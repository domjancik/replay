[package]
name = "rm-replay-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "reMarkable stroke replay scheduling and native-reference anchor fitting for Rust and WebAssembly"
repository = "https://github.com/domjancik/replay"
homepage = "https://replay.domj.net"
readme = "README.md"
keywords = ["remarkable", "replay", "ink", "animation", "wasm"]
categories = ["graphics", "multimedia", "wasm"]
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "core.mjs"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
